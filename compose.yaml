services:
  rustchan:
    image: ${RUSTCHAN_IMAGE:-ghcr.io/uphiago/rustchan:latest}
    restart: unless-stopped
    # Not published on the host: only the Caddy proxy reaches it, over the
    # private edge network below.
    expose:
      - "8080"
    environment:
      CHAN_HOST: 0.0.0.0
      CHAN_PORT: "8080"
      CHAN_TOR_SUPPORT: "false"
      CHAN_BEHIND_PROXY: "true"
      CHAN_TRUSTED_PROXY_CIDRS: "172.28.0.0/24"
      CHAN_PUBLIC_HOSTS: "nullchan.dev"
      CHAN_HTTPS_COOKIES: "true"
    volumes:
      - rustchan-data:/data
    networks:
      - edge
    stop_grace_period: 90s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - rustchan
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - edge

networks:
  edge:
    ipam:
      config:
        - subnet: 172.28.0.0/24

volumes:
  rustchan-data:
  caddy-data:
  caddy-config:
